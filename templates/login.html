{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h2 class="mb-4">Login</h2>
        <form method="POST" id="login-form">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" name="username" id="username" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" name="password" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary" id="login-submit">Login</button>
        </form>
        <p class="mt-3">No account? <a href="{{ url_for('register') }}">Register</a></p>
        <p class="text-muted small">Admin test login: <code>admin</code> / <code>admin123</code></p>
    </div>
</div>
{% endblock %}
